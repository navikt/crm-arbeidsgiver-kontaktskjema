<template>
    <div class="containerBreadcrumbs">
        <svg
            width="1.5em"
            class="homeicon"
            height="1.5em"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            focusable="false"
            aria-hidden="true"
        >
            <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M11.47 2.47a.75.75 0 0 1 1.06 0l7 7c.141.14.22.331.22.53v11a.75.75 0 0 1-.75.75h-5a.75.75 0 0 1-.75-.75v-4.25h-2.5V21a.75.75 0 0 1-.75.75H5a.75.75 0 0 1-.75-.75V10a.75.75 0 0 1 .22-.53l7-7Zm-5.72 7.84v9.94h3.5V16a.75.75 0 0 1 .75-.75h4a.75.75 0 0 1 .75.75v4.25h3.5v-9.94L12 4.06l-6.25 6.25Z"
                fill="currentColor"
            ></path>
        </svg>
        <nav aria-label="Brødsmulesti">
            <ol class="breadcrumb">
                <li>
                    <a href="https://www.nav.no/" class="listElement">nav.no</a>
                    <svg
                        width="1em"
                        height="1em"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        focusable="false"
                        aria-hidden="true"
                    >
                        <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"
                            d="M17 12L8.429 3 7 4.5l7.143 7.5L7 19.5 8.429 21 17 12z"
                            fill="black"
                        ></path>
                    </svg>
                </li>
                <li>
                    <a href="https://www.nav.no/arbeidsgiver/" class="listElement">Arbeidsgiver</a>
                    <svg
                        width="1em"
                        height="1em"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        focusable="false"
                        aria-hidden="true"
                    >
                        <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"
                            d="M17 12L8.429 3 7 4.5l7.143 7.5L7 19.5 8.429 21 17 12z"
                            fill="black"
                        ></path>
                    </svg>
                </li>
                <li>
                    <a href="https://nav.no/arbeidsgiver/kontaktoss" class="listElement">Kontakt Nav</a>
                    <svg
                        width="1em"
                        height="1em"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        focusable="false"
                        aria-hidden="true"
                    >
                        <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"
                            d="M17 12L8.429 3 7 4.5l7.143 7.5L7 19.5 8.429 21 17 12z"
                            fill="black"
                        ></path>
                    </svg>
                </li>
                <li>
                    <span aria-current="page">Kontaktskjema</span>
                </li>
            </ol>
        </nav>
    </div>

    <!--============================Head Banner=========================================-->
    <main role="main">
        <div class="banner">
            <div class="banner-inside">
                <h1 class="title-contactform">Kontaktskjema for arbeidsgivere</h1>
                <img data-id="imageLogo" src={logoImage} alt="" />
            </div>
        </div>
        <div class="contactform-inside">
            <div class="navds-body-long"><p>Alle felter må fylles ut.</p></div>
            <!--============================Radio button - Theme=========================================-->

            <c-radiobuttons
                radiobuttons={themeOptions}
                onradiobuttonsclick={handleThemeOption}
                header="Hva gjelder det?"
                group-name="radioGroupThemeOptions"
                flex-direction="column"
                type="radio"
                data-id="radioTheme"
                aria-required="true"
            ></c-radiobuttons>

            <div if:false={themeChecked}>
                <div role="alert" class="errorText">Du må velge et tema</div>
            </div>

            <!--============================Info text - Other themes=========================================-->
            <div class="containerInfo">
                <div class="navds-alert navds-alert--small navds-alert--info navds-body-long--small">
                    <img class="navds-alert__icon" src={infoImage} alt="informasjonsikon" />
                    <span
                        >Velg tema som best beskriver henvendelsen din. Dersom du ikke finner et tema som passer, ring
                        arbeidsgivertelefonen på tlf.&nbsp;
                        <a href="tel:+4755553336" class="lenke">55&nbsp;55&nbsp;33&nbsp;36</a></span
                    >
                </div>
            </div>

            <template if:true={checkedPreventSickLeave}>
                <!--============================Radio button - Contacted employee representant=========================================-->
                <c-radiobuttons
                    radiobuttons={contactedEmployeeRepOptions}
                    onradiobuttonsclick={handleContactedEmployeeRep}
                    header="Har du snakket med en ansattrepresentant om forebygging av sykefravær?"
                    group-name="radioGroup"
                    flex-direction="row"
                    type="radio"
                    helptext-content="Arbeidet med å forebygge sykefravær og sikre godt arbeidsmiljø, er et ansvar som deles
                            mellom arbeidsgiver og tillitsvalgte (eller ansattrepresentanter). Nav Arbeidslivssenter kan
                            bistå i dette arbeidet."
                ></c-radiobuttons>
            </template>

            <!--============================Input fields=========================================-->

            <div class="input-fields">
                <c-input
                    label="Organisasjonsnummer"
                    description="Eksempel: 509100675"
                    data-id="inputOrgNumber"
                    type="text"
                    value={contactOrg}
                    onchange={handleOrgNumberChange}
                    error-text="Du må fylle inn et gyldig organisasjonsnummer"
                    maxlength="9"
                    aria-required="true"
                ></c-input>

                <template if:true={isOrgValid}>
                    <div
                        tabindex="0"
                        data-id="accountNameRead"
                        class="navds-alert navds-alert--inline navds-alert--success navds-alert--small navds-body-long--small"
                        role="alert"
                    >
                        <span class="navds-sr-only">Suksess: </span>
                        <span>{accountName} ble hentet automatisk som bedriftens navn</span>
                    </div>
                </template>
            </div>
            <template if:true={offerSubUnitSelection}>
                <div class="input-fields">
                    <c-picklist
                        master-label="Om mulig, spesifiser avdeling"
                        helptext-content="Dersom henvendelsen gjelder en konkret avdeling eller kontor kan du velge den fra listen."
                        data-id="inputSubUnit"
                        choices={subUnitChoices}
                        onpicklistvaluechange={handleSubUnitSelection}
                        aria-required="false"
                    ></c-picklist>
                </div>
            </template>
            <div class="input-fields">
                <c-input
                    label="Ditt navn"
                    description="Eksempel: Kari Nordmann"
                    data-id="inputName"
                    type="text"
                    value={contactName}
                    onchange={handleNameChange}
                    error-text="Du må fylle inn navnet ditt"
                    maxlength="80"
                    aria-required="true"
                ></c-input>
            </div>
            <div class="input-fields">
                <c-input
                    label="E-post"
                    description="Eksempel: kari.nordmann@nav.no"
                    data-id="inputEpost"
                    type="text"
                    value={contactEmail}
                    onchange={handleEmailChange}
                    error-text="Du må fylle inn en gyldig e-post adresse"
                    maxlength="80"
                    aria-required="true"
                ></c-input>
            </div>
            <div class="input-fields">
                <c-input
                    label="Telefonnummer"
                    description="Eksempel: 12345678"
                    data-id="inputPhone"
                    type="text"
                    value={contactPhone}
                    onchange={handlePhoneChange}
                    error-text="Du må fylle inn et gyldig telefonnummer"
                    maxlength="8"
                    aria-required="true"
                ></c-input>
            </div>

            <!--============================Info text and send button=========================================-->

            <div class="containerInfo">
                <div class="navds-alert navds-alert--small navds-alert--info navds-body-long--small">
                    <img class="navds-alert__icon" src={infoImage} alt="informasjonsikon" />
                    <span
                        >Nav bruker disse opplysningene når vi kontakter deg. Vi lagrer disse opplysningene om deg, slik
                        at vi kan kontakte deg angående temaet du velger i dette skjemaet. Opplysningene blir ikke delt
                        eller brukt til andre formål.</span
                    >
                </div>
            </div>
            <c-ds-Button variant="primary" size="medium" text="Send inn" onclick={saveContactForm}></c-ds-Button>
        </div>
    </main>
</template>
